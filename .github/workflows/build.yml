name: Build pinned LocalAI runtimes
on:
  workflow_dispatch:
    inputs:
      engine:
        type: choice
        description: Upstream engine
        options: [llama, whisper]
        required: true
      publish:
        type: boolean
        description: Publish testing runtime release after all builds pass
        default: false
permissions:
  contents: read
concurrency:
  group: localai-${{ inputs.engine }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      version: ${{ steps.pin.outputs.version }}
      repository: ${{ steps.pin.outputs.repository }}
      release: ${{ steps.pin.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - id: pin
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          python3 - <<'PY'
          import json, os
          pin = json.load(open('upstreams.json'))[os.environ['ENGINE']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('commit', 'version', 'repository'):
                  print(name + '=' + pin[name], file=out)
              print('release=' + os.environ['ENGINE'] + '-' + pin['version'] + '-' + os.environ['GITHUB_SHA'][:12], file=out)
          PY
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        backend: [cpu, vulkan, cuda]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.source.outputs.repository }}
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
          path: src
          submodules: recursive
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build native server
        env:
          ENGINE: ${{ inputs.engine }}
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          UPSTREAM_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_TAG: ${{ needs.source.outputs.release }}
        run: |
          docker buildx build --progress plain --platform "linux/$ARCH" --target artifact \
            --build-arg "ENGINE=$ENGINE" --build-arg "BACKEND=$BACKEND" \
            --build-arg "SOURCE_COMMIT=$SOURCE_COMMIT" --build-arg "UPSTREAM_VERSION=$UPSTREAM_VERSION" \
            --build-arg "RELEASE_TAG=$RELEASE_TAG" --output type=local,dest=artifacts -f build/Dockerfile .
      - name: Immediate manually downloadable artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.engine }}-${{ matrix.arch }}-${{ matrix.backend }}
          path: artifacts/*
          if-no-files-found: error
  release:
    needs: [source, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect release manifest and checksums
        env:
          ENGINE: ${{ inputs.engine }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          UPSTREAM_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_TAG: ${{ needs.source.outputs.release }}
        run: |
          git archive --format=tar.gz --output artifacts/build-source.tar.gz HEAD
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('artifacts')
          entries=[json.loads(p.read_text()) for p in root.glob('*.json')]
          expected={(a,b) for a in ('arm64','amd64') for b in ('cpu','vulkan','cuda')}
          assert {(e['arch'],e['backend']) for e in entries} == expected
          for e in entries:
              assert e['sourceCommit']==os.environ['SOURCE_COMMIT'] and e['engine']==os.environ['ENGINE']
              assert hashlib.file_digest((root/e['file']).open('rb'),'sha256').hexdigest()==e['sha256']
          manifest={'version':1,'engine':os.environ['ENGINE'],'release':os.environ['RELEASE_TAG'],
              'upstreamVersion':os.environ['UPSTREAM_VERSION'],'sourceCommit':os.environ['SOURCE_COMMIT'],'artifacts':entries}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with (root/'SHA256SUMS').open('w') as out:
              for p in sorted(root.iterdir()):
                  if p.name!='SHA256SUMS': out.write(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name+'\n')
          PY
      - name: Publish testing runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.release }}
          ENGINE: ${{ inputs.engine }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --title "$ENGINE native runtimes" --prerelease --notes-file release-notes.md
