name: Build stable-release LocalAI runtimes
on:
  workflow_dispatch:
    inputs:
      engine:
        type: choice
        description: Upstream engine
        options: [llama, whisper]
        required: true
      publish:
        type: boolean
        description: Publish testing runtime release after all builds pass
        default: false
      targets:
        type: choice
        description: Full release matrix, complete Android matrix, or desktop build subsets
        options: [all, android, linux-arm64, linux-amd64-android]
        default: all
permissions:
  contents: read
concurrency:
  group: localai-${{ inputs.engine }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      version: ${{ steps.pin.outputs.version }}
      repository: ${{ steps.pin.outputs.repository }}
      release: ${{ steps.pin.outputs.release }}
      matrix: ${{ steps.pin.outputs.matrix }}
      platforms: ${{ steps.pin.outputs.platforms }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify retained native sources and fail-closed linkage gates
        run: python3 build/test_native_sources.py
      - name: Verify exact Silero model conversion
        if: ${{ inputs.engine == 'whisper' }}
        run: |
          python3 -m venv .vad-verify
          .vad-verify/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu numpy==2.3.5
          .vad-verify/bin/python build/vad/verify.py --reproduce
      - id: pin
        env:
          ENGINE: ${{ inputs.engine }}
          TARGETS: ${{ inputs.targets }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 build/releases.py --verify "$ENGINE"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "build")
          from releases import api
          pin = json.load(open('upstreams.json'))[os.environ['ENGINE']]
          targets = os.environ.get('TARGETS') or 'all'
          assert targets in ('all', 'android', 'linux-arm64', 'linux-amd64-android')
          assert os.environ['PUBLISH'] != 'true' or targets in ('all', 'android'), 'Publishing requires a complete platform release matrix'
          matrix = [{'os': system, 'arch': arch, 'backend': backend,
                     'runner': 'ubuntu-24.04-arm' if system == 'linux' and arch == 'arm64' else 'ubuntu-24.04'}
                    for system in ('linux', 'android') for arch in ('amd64', 'arm64') for backend in ('vulkan', 'cuda')
                    if (system == 'linux' or backend != 'cuda') and (targets == 'all' or (targets == 'android' and system == 'android') or (targets == 'linux-arm64' and (system, arch) == ('linux', 'arm64')) or (targets == 'linux-amd64-android' and (system, arch) != ('linux', 'arm64')))]
          release = os.environ['ENGINE'] + '-' + pin['version'] + '-r' + str(pin['packageRevision'])
          if os.environ['PUBLISH'] == 'true':
              for platform in (['android'] if targets == 'android' else ['linux', 'android']):
                  tag = ('android-' if platform == 'android' else '') + release
                  assert api('repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + tag, missing=True) is None, 'Release already exists: ' + tag + '; use an explicit new packageRevision for a recipe fix'
                  ref = api('repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/tags/' + tag, missing=True)
                  assert ref is None or (ref['object']['type'] == 'commit' and ref['object']['sha'] == os.environ['GITHUB_SHA']), 'Existing package tag does not identify this recipe: ' + tag
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('commit', 'version', 'repository'):
                  print(name + '=' + pin[name], file=out)
              print('release=' + release, file=out)
              print('matrix=' + json.dumps({'include': matrix}), file=out)
              print('platforms=' + json.dumps(['android'] if targets == 'android' else ['linux', 'android']), file=out)
          PY
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.source.outputs.repository }}
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
          path: src
          submodules: recursive
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .localai-cache
          key: localai-${{ inputs.engine }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}-${{ needs.source.outputs.commit }}-${{ hashFiles('build/native-sources/**/SOURCE.json') }}-${{ github.sha }}
          restore-keys: |
            localai-${{ inputs.engine }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}-
      - name: Build cached native runtimes
        env:
          ENGINE: ${{ inputs.engine }}
          BACKEND: ${{ matrix.backend }}
          TARGETOS: ${{ matrix.os }}
          TARGETARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          UPSTREAM_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_TAG: ${{ needs.source.outputs.release }}
          BUILDER_COMMIT: ${{ github.sha }}
        run: |
          docker buildx build --progress plain --target builder --load -t localai-builder \
            --build-arg "TARGETARCH=$TARGETARCH" --build-arg "TARGETOS=$TARGETOS" --build-arg "BACKEND=$BACKEND" \
            --cache-from type=gha,scope=builder-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }} \
            --cache-to type=gha,mode=max,scope=builder-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }} \
            -f build/Dockerfile .
          mkdir -p .localai-cache .localai-recipe artifacts
          cp build/{Dockerfile,package.py,releases.py,local.sh,termux.cmake,vad.cmake,native_sources.py,native-audit.cmake,link_audit.py,DONOR-LICENSE} LICENSE upstreams.json .localai-recipe/
          cp -a build/vad build/native-sources .localai-recipe/
          docker run --rm --user "$(id -u):$(id -g)" \
            -e ENGINE -e BACKEND -e TARGETOS -e TARGETARCH -e SOURCE_COMMIT -e UPSTREAM_VERSION -e RELEASE_TAG -e BUILDER_COMMIT \
            -e BUILD_JOBS="$(nproc)" -e OMP_WAIT_POLICY=ACTIVE -e GOMP_SPINCOUNT=INFINITE \
            -e BUILD_INPUTS=/recipe -v "$PWD/src:/src" -v "$PWD/.localai-cache:/cache" -v "$PWD/artifacts:/out" \
            -v "$PWD/.localai-recipe:/recipe:ro" \
            localai-builder python3 /recipe/package.py
      - name: Preserve compiler cache even when a source audit blocks packaging
        if: ${{ always() && steps.compiler-cache.outputs.cache-hit != 'true' && steps.compiler-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: .localai-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Retain native source and linker diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ inputs.engine }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}
          path: .localai-cache/evidence/
          if-no-files-found: ignore
      - name: Immediate manually downloadable artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.engine }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}
          path: artifacts/*
          if-no-files-found: error
  release:
    needs: [source, build]
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.source.outputs.platforms) }}
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: ${{ inputs.engine }}-${{ matrix.platform }}-*
          merge-multiple: true
      - name: Collect release manifest and checksums
        env:
          ENGINE: ${{ inputs.engine }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          UPSTREAM_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_TAG: ${{ matrix.platform == 'android' && format('android-{0}', needs.source.outputs.release) || needs.source.outputs.release }}
          TARGETOS: ${{ matrix.platform }}
        run: |
          git archive --format=tar.gz --output artifacts/build-source.tar.gz HEAD
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('artifacts')
          entries=[json.loads(p.read_text()) for p in root.glob('*.json')]
          pin=json.load(open('upstreams.json'))[os.environ['ENGINE']]
          upstream={'tag':pin['version'],'commit':pin['commit'],'url':pin['releaseUrl'],
                    'releaseId':pin['releaseId'],'tagObject':pin['tagObject']}
          expected={(os.environ['TARGETOS'],a,b) for a in ('arm64','amd64') for b in ('vulkan','cuda') if os.environ['TARGETOS']=='linux' or b!='cuda'}
          assert len(entries)==len(expected) and {(e['os'],e['arch'],e['backend']) for e in entries} == expected
          for e in entries:
              assert e['sourceCommit']==os.environ['SOURCE_COMMIT'] and e['engine']==os.environ['ENGINE']
              assert e['upstreamRelease']==upstream and e['packageRevision']==pin['packageRevision']
              assert e.get('capabilities', {}).get('cpu') is True
              assert e['engine'] != 'llama' or (e['capabilities'].get('router') is True and e['capabilities'].get('subprocess') is True)
              if e['engine'] == 'whisper':
                  assert e['capabilities'].get('streamingVad') is True and 'bashkitten-vad' in e['executables']
                  expected_vad=json.load(open('build/vad/SOURCE.json'))
                  assert e['vad'] == {k:expected_vad[k] for k in ('silero','converter','model')}
              assert hashlib.file_digest((root/e['file']).open('rb'),'sha256').hexdigest()==e['sha256']
              assert e['sourceFile'] == e['file'].removesuffix('.tar.gz') + '-source.tar.gz'
              assert hashlib.file_digest((root/e['sourceFile']).open('rb'),'sha256').hexdigest()==e['sourceSHA256']
              assert e['correspondingSourcesVerified'] is True and e['hostStaticLinkageVerified'] is True
          manifest={'version':1,'engine':os.environ['ENGINE'],'release':os.environ['RELEASE_TAG'],
              'upstreamVersion':os.environ['UPSTREAM_VERSION'],'sourceCommit':os.environ['SOURCE_COMMIT'],
              'upstreamRelease':upstream,'packageRevision':pin['packageRevision'],'artifacts':entries}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with (root/'SHA256SUMS').open('w') as out:
              for p in sorted(root.iterdir()):
                  if p.name!='SHA256SUMS': out.write(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name+'\n')
          PY
      - name: Publish testing runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.platform == 'android' && format('android-{0}', needs.source.outputs.release) || needs.source.outputs.release }}
          ENGINE: ${{ inputs.engine }}
        run: |
          TITLE="$RELEASE_TAG · Whisper and Parakeet"
          if [ "$ENGINE" = llama ]; then TITLE="$RELEASE_TAG · llama.cpp and llama-tts"; fi
          gh release create "$RELEASE_TAG" artifacts/* --target "$GITHUB_SHA" --title "$TITLE" --prerelease --latest=false --notes-file release-notes.md
