name: Build pinned LocalAI runtimes
on:
  workflow_dispatch:
    inputs:
      engine:
        type: choice
        description: Upstream engine
        options: [llama, whisper]
        required: true
      publish:
        type: boolean
        description: Publish testing runtime release after all builds pass
        default: false
      targets:
        type: choice
        description: Full release matrix or native ARM64 desktop builds
        options: [all, linux-arm64, linux-amd64-android]
        default: all
permissions:
  contents: read
concurrency:
  group: localai-${{ inputs.engine }}-${{ inputs.targets }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      version: ${{ steps.pin.outputs.version }}
      repository: ${{ steps.pin.outputs.repository }}
      release: ${{ steps.pin.outputs.release }}
      matrix: ${{ steps.pin.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: pin
        env:
          ENGINE: ${{ inputs.engine }}
          TARGETS: ${{ inputs.targets }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import json, os
          pin = json.load(open('upstreams.json'))[os.environ['ENGINE']]
          targets = os.environ.get('TARGETS') or 'all'
          assert targets in ('all', 'linux-arm64', 'linux-amd64-android')
          assert os.environ['PUBLISH'] != 'true' or targets == 'all', 'Publishing requires the full release matrix'
          matrix = [{'os': system, 'arch': arch, 'backend': backend,
                     'runner': 'ubuntu-24.04-arm' if system == 'linux' and arch == 'arm64' else 'ubuntu-24.04'}
                    for system in ('linux', 'android') for arch in ('amd64', 'arm64') for backend in ('cpu', 'vulkan', 'cuda')
                    if (system == 'linux' or backend != 'cuda') and (targets == 'all' or (targets == 'linux-arm64' and (system, arch) == ('linux', 'arm64')) or (targets == 'linux-amd64-android' and (system, arch) != ('linux', 'arm64')))]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('commit', 'version', 'repository'):
                  print(name + '=' + pin[name], file=out)
              print('release=' + os.environ['ENGINE'] + '-' + pin['version'] + '-' + os.environ['GITHUB_SHA'][:12], file=out)
              print('matrix=' + json.dumps({'include': matrix}), file=out)
          PY
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.source.outputs.repository }}
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
          path: src
          submodules: recursive
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: actions/cache@v4
        with:
          path: .localai-cache
          key: localai-${{ inputs.engine }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}-${{ needs.source.outputs.commit }}-${{ github.sha }}
          restore-keys: |
            localai-${{ inputs.engine }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}-
      - name: Build cached native runtimes
        env:
          ENGINE: ${{ inputs.engine }}
          BACKEND: ${{ matrix.backend }}
          TARGETOS: ${{ matrix.os }}
          TARGETARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          UPSTREAM_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_TAG: ${{ needs.source.outputs.release }}
          BUILDER_COMMIT: ${{ github.sha }}
        run: |
          docker buildx build --progress plain --target builder --load -t localai-builder \
            --build-arg "TARGETARCH=$TARGETARCH" --build-arg "TARGETOS=$TARGETOS" --build-arg "BACKEND=$BACKEND" \
            --cache-from type=gha,scope=builder-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }} \
            --cache-to type=gha,mode=max,scope=builder-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }} \
            -f build/Dockerfile .
          mkdir -p .localai-cache .localai-recipe artifacts
          cp build/{Dockerfile,package.py,local.sh,DONOR-LICENSE} LICENSE upstreams.json .localai-recipe/
          docker run --rm --user "$(id -u):$(id -g)" \
            -e ENGINE -e BACKEND -e TARGETOS -e TARGETARCH -e SOURCE_COMMIT -e UPSTREAM_VERSION -e RELEASE_TAG -e BUILDER_COMMIT \
            -e BUILD_JOBS="$(nproc)" -e OMP_WAIT_POLICY=ACTIVE -e GOMP_SPINCOUNT=INFINITE \
            -e BUILD_INPUTS=/recipe -v "$PWD/src:/src" -v "$PWD/.localai-cache:/cache" -v "$PWD/artifacts:/out" \
            -v "$PWD/.localai-recipe:/recipe:ro" \
            localai-builder python3 /recipe/package.py
      - name: Immediate manually downloadable artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.engine }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}
          path: artifacts/*
          if-no-files-found: error
  release:
    needs: [source, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect release manifest and checksums
        env:
          ENGINE: ${{ inputs.engine }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          UPSTREAM_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_TAG: ${{ needs.source.outputs.release }}
        run: |
          git archive --format=tar.gz --output artifacts/build-source.tar.gz HEAD
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('artifacts')
          entries=[json.loads(p.read_text()) for p in root.glob('*.json')]
          expected={(o,a,b) for o in ('linux','android') for a in ('arm64','amd64') for b in ('cpu','vulkan','cuda') if o=='linux' or b!='cuda'}
          assert len(entries)==len(expected) and {(e['os'],e['arch'],e['backend']) for e in entries} == expected
          for e in entries:
              assert e['sourceCommit']==os.environ['SOURCE_COMMIT'] and e['engine']==os.environ['ENGINE']
              assert hashlib.file_digest((root/e['file']).open('rb'),'sha256').hexdigest()==e['sha256']
          manifest={'version':1,'engine':os.environ['ENGINE'],'release':os.environ['RELEASE_TAG'],
              'upstreamVersion':os.environ['UPSTREAM_VERSION'],'sourceCommit':os.environ['SOURCE_COMMIT'],'artifacts':entries}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with (root/'SHA256SUMS').open('w') as out:
              for p in sorted(root.iterdir()):
                  if p.name!='SHA256SUMS': out.write(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name+'\n')
          PY
      - name: Publish testing runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.release }}
          ENGINE: ${{ inputs.engine }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --title "$ENGINE native runtimes" --prerelease --notes-file release-notes.md
