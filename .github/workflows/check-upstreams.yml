name: Check upstream runtime pins
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Report newer official stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          pins=json.load(open('upstreams.json'))
          for engine,pin in pins.items():
              latest=json.loads(subprocess.check_output(['gh','api','repos/'+pin['repository']+'/releases/latest']))
              print(engine+': pinned '+pin['version']+'; upstream '+latest['tag_name'])
              if latest['tag_name']!=pin['version']:
                  print('Update upstreams.json with the verified commit, then build and manually verify before publication.')
          PY
